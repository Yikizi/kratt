name: Kratt TartuNLP Local TTS
version: 0.2.0
slug: kratt_neurokone_tts
description: Estonian text-to-speech for Home Assistant Assist via local TartuNLP
url: https://github.com/Yikizi/kratt/tree/main/kratt-neurokone-tts
arch:
  - amd64
startup: services
boot: auto
init: false
stage: experimental
discovery:
  - wyoming
ports:
  10301/tcp: null
ports_description:
  10301/tcp: Wyoming TTS protocol
backup_exclude:
  - models
  - models/**
  - cache
  - cache/**
  - huggingface
  - huggingface/**
options:
  model_zip_url: https://github.com/TartuNLP/text-to-speech-worker/releases/download/v3.1.0/multispeaker.zip
  voice: meelis
  speed: 1.0
  max_input_length: 500
  debug_logging: false
schema:
  model_zip_url: str
  voice: list(albert|indrek|kalev|kylli|liivika|mari|meelis|peeter|tambet|vesta)
  speed: float(0.5,2.0)
  max_input_length: int(50,500)
  debug_logging: bool
